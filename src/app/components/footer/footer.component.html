<footer>
  <!-- Ridge from lake-blue top -->

  </div>

  <div class="wrap">
    <div class="foot">
      <div class="foot-brand disp big">AixMan</div>

      <div>
        <h4 class="cond">Contact</h4>
        <ul>
          <li><a href="mailto:contact@aixman.fr">contact&#64;aixman.fr</a></li>
          <li>Aix-les-Bains, Savoie</li>
        </ul>
      </div>

      <div>
        <h4 class="cond">Suivre</h4>
        <ul>
          <li><a href="#">Instagram</a></li>
          <li><a href="#">Facebook</a></li>
          <li><a href="#">Strava</a></li>

    <div class="legal">
