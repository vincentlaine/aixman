<section id="hero">
  <!-- Topographic SVG overlay -->
  <div class="hero-topo">
    <svg width="100%" height="100%" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1600 1000">
      <rect width="100%" height="100%" fill="url(#topo-light)" />
    </svg>
  </div>

  <div class="container">
    <div class="hero-grid">
      <!-- Left column: text -->
      <div class="hero-left">
        <div class="hero-logo-floating">
          <img src="assets/logo-aixman.png" alt="AixMan" />
        </div>

        <div class="eyebrow">{{ langService.t().eyebrow }}</div>
        <h1 class="hero-title">Aix<em>Man</em></h1>
        <p class="hero-tagline">Du lac au sommet,<br />une course entre <em>eau, terre &amp; ciel</em>.</p>

        <div class="hero-meta">
          <div class="hero-meta-item">
            <div class="hero-meta-label">Date</div>
            <div class="hero-meta-val">{{ langService.t().date }}</div>
          </div>
          <div class="hero-meta-item">
            <div class="hero-meta-label">Lieu</div>
            <div class="hero-meta-val">Aix-les-Bains</div>
          </div>
          <div class="hero-meta-item">
            <div class="hero-meta-label">Édition</div>
            <div class="hero-meta-val">1ère / Inaugurale</div>
          </div>
        </div>

        <div class="hero-btns">
          <a href="#inscriptions" class="btn btn-primary">{{ langService.t().btnRegister }} →</a>
          <a href="#parcours" class="btn btn-outline">{{ langService.t().btnCourses }}</a>
        </div>
      </div>

      <!-- Right column: orbit + circular photo -->
      <div class="hero-right">
        <div class="hero-illustration">
          <!-- Rotating orbit rings with discipline badges -->
          <svg class="hero-orbit" viewBox="0 0 600 600" aria-hidden="true">
            <g fill="none" stroke="#3F8A6E" stroke-width="1" opacity="0.35">
              <circle cx="300" cy="300" r="298" stroke-dasharray="3 8" />
              <circle cx="300" cy="300" r="270" />
              <circle cx="300" cy="300" r="240" stroke-dasharray="1 5" />
            </g>
            <!-- Discipline badges on orbit -->
            <g font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#3F8A6E" text-anchor="middle">
              <g transform="translate(300,18)">
                <circle r="22" fill="#FAF6EC" stroke="#3F8A6E" stroke-width="1" />
                <text y="5" font-size="16">🏊</text>
              </g>
              <g transform="translate(560,420)">
                <circle r="22" fill="#FAF6EC" stroke="#3F8A6E" stroke-width="1" />
                <text y="5" font-size="16">🚴</text>
              </g>
              <g transform="translate(40,420)">
                <circle r="22" fill="#FAF6EC" stroke="#3F8A6E" stroke-width="1" />
                <text y="5" font-size="16">🏃</text>
              </g>
            </g>
          </svg>

          <!-- Circular photo frame -->
          <div class="hero-circle-frame">
            <!-- Lac du Bourget depuis la Chambotte · F. Pépellin · CC BY-SA 4.0 · Wikimedia Commons -->
            <img
              src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Lac_du_Bourget_depuis_la_Chambotte_c%C3%B4t%C3%A9_nord_au_matin_%28%C3%A9t%C3%A9_2020%29.JPG/1280px-Lac_du_Bourget_depuis_la_Chambotte_c%C3%B4t%C3%A9_nord_au_matin_%28%C3%A9t%C3%A9_2020%29.JPG"
              alt="Lac du Bourget depuis la Chambotte, Savoie"
            />
            <div class="hero-circle-overlay"></div>
          </div>

          <!-- Distances bar floating below photo -->
          <div class="hero-disciplines">
            <div class="hd-item">
              <span class="hd-num">2</span>
              <span class="hd-lbl">km nage</span>
            </div>
            <div class="hd-divider"></div>
            <div class="hd-item">
              <span class="hd-num">100</span>
              <span class="hd-lbl">km vélo</span>
            </div>
            <div class="hd-divider"></div>
            <div class="hd-item">
              <span class="hd-num">13</span>
              <span class="hd-lbl">km cap</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
