<section id="inscriptions">
  <div class="wrap">
    <div class="lbl cond"><i></i><span>Inscriptions 2027</span></div>
    <h2 class="disp">Prenez le<br>départ</h2>

    <div class="tarifs">
      <div class="tarif hot">
        <span class="cond">Jusqu'au 31 déc. 2026</span>
        <h3>Early bird</h3>
        <div class="price">85€</div>
      </div>
      <div class="tarif">
        <span class="cond">Janv. → mai 2027</span>
        <h3>Individuel</h3>
        <div class="price">105€</div>
      </div>
      <div class="tarif">
        <span class="cond">Équipe de 2 ou 3</span>
        <h3>Relais</h3>
        <div class="price">120€</div>
      </div>
    </div>

    <div class="insc-cta">
      <span>Places limitées · Licence ou certificat médical requis</span>
      <a class="btn" href="#" (click)="onRegisterClick($event)">S'inscrire maintenant</a>
    </div>
  </div>
</section>
